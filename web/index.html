<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ark — Package Repository</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #f78166;
      --accent-2: #ffa198;
      --green: #3fb950;
      --code-bg: #0a0d12;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    header {
      padding: 3rem 2rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(247, 129, 102, 0.08), transparent);
    }
    header h1 {
      font-size: 2.4rem;
      letter-spacing: 0.08em;
    }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); margin-top: 0.5rem; }
    .stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1.2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .stats b { color: var(--text); }
    .toolbar {
      max-width: 1000px;
      margin: 1.5rem auto 0;
      padding: 0 1rem;
    }
    .toolbar input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    .toolbar input:focus { border-color: var(--accent); }
    main {
      max-width: 1000px;
      margin: 1.5rem auto 3rem;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card h2 { font-size: 1.1rem; }
    .badge {
      background: rgba(63, 185, 80, 0.15);
      color: var(--green);
      border: 1px solid rgba(63, 185, 80, 0.4);
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
    }
    .card .desc { color: var(--muted); font-size: 0.9rem; min-height: 2.4em; }
    .card .path {
      font-family: ui-monospace, monospace;
      font-size: 0.78rem;
      color: var(--accent-2);
      word-break: break-all;
    }
    .cmd {
      position: relative;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 7em;
      overflow: auto;
    }
    .cmd button {
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .cmd button:hover { color: var(--text); border-color: var(--accent); }
    .install-hint {
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      color: var(--accent);
      background: rgba(247, 129, 102, 0.08);
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .chips .label {
      color: var(--muted);
      font-size: 0.75rem;
      align-self: center;
    }
    .chip {
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      color: var(--accent-2);
      background: rgba(247, 129, 102, 0.1);
      border: 1px solid rgba(247, 129, 102, 0.35);
      border-radius: 999px;
      padding: 0.1rem 0.55rem;
    }
    .recipe-link {
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .recipe-link a { color: var(--accent-2); text-decoration: none; }
    .recipe-link a:hover { text-decoration: underline; }
    .error {
      max-width: 700px;
      margin: 3rem auto;
      padding: 1.5rem;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background: var(--panel);
      color: var(--muted);
      line-height: 1.6;
    }
    .error code { color: var(--accent-2); }
    footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      padding: 1.5rem 1rem;
      line-height: 1.8;
    }
    footer code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      color: var(--accent-2);
    }
  </style>
</head>
<body>
  <header>
    <h1>📦 Ark<span>.</span> Repository</h1>
    <p>Package index for the <strong>Ark</strong> package manager</p>
    <div class="stats">
      <div><b id="stat-count">…</b> packages</div>
      <div><b id="stat-latest">…</b> latest version</div>
      <div>updated <b id="stat-updated">…</b></div>
    </div>
  </header>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Search packages…" autocomplete="off" />
  </div>

  <main id="grid"></main>

  <footer>
    Serve this repository with <code>python3 -m http.server 8000</code> (inside <code>web/</code>)<br />
    Point the CLI at it with <code>ARK_INDEX_URL=http://localhost:8000/packages.json ark update</code>
  </footer>

  <script>
    let packages = [];

    const grid = document.getElementById("grid");
    const search = document.getElementById("search");

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const old = btn.textContent;
        btn.textContent = "copied!";
        setTimeout(() => (btn.textContent = old), 1200);
      });
    }

    function card(pkg) {
      const el = document.createElement("div");
      el.className = "card";

      const head = document.createElement("div");
      head.className = "card-head";
      const title = document.createElement("h2");
      title.textContent = pkg.name;
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "v" + pkg.version;
      head.append(title, badge);

      const desc = document.createElement("p");
      desc.className = "desc";
      desc.textContent = pkg.description || "No description provided.";

      const path = document.createElement("div");
      path.className = "path";
      path.textContent = "📁 " + pkg.path;

      if (Array.isArray(pkg.flags) && pkg.flags.length) {
        const chips = document.createElement("div");
        chips.className = "chips";
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = "USE flags:";
        chips.append(label);
        for (const f of pkg.flags) {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = "+" + f;
          chips.append(chip);
        }
        el.append(chips);
      }

      if (pkg.recipe) {
        const rec = document.createElement("div");
        rec.className = "recipe-link";
        const a = document.createElement("a");
        a.href = pkg.recipe;
        a.textContent = "📜 " + pkg.recipe;
        rec.append(a);
        el.append(rec);
      }

      const cmdBox = document.createElement("div");
      cmdBox.className = "cmd";
      cmdBox.textContent = pkg.installation_command;
      const copyBtn = document.createElement("button");
      copyBtn.textContent = "copy";
      copyBtn.onclick = () => copyText(pkg.installation_command, copyBtn);
      cmdBox.append(copyBtn);

      const hint = document.createElement("div");
      hint.className = "install-hint";
      hint.textContent = pkg.recipe
        ? "$ ark forge " + pkg.name + (Array.isArray(pkg.flags) && pkg.flags.length ? " --flags " + pkg.flags.join(",") : "")
        : "$ ark install " + pkg.name;

      el.append(head, desc, path, cmdBox, hint);
      return el;
    }

    function render(filter = "") {
      const q = filter.trim().toLowerCase();
      const visible = packages.filter(
        (p) =>
          !q ||
          p.name.toLowerCase().includes(q) ||
          (p.description || "").toLowerCase().includes(q)
      );
      grid.replaceChildren(...visible.map(card));
    }

    fetch("packages.json")
      .then((res) => {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then((data) => {
        packages = Array.isArray(data) ? data : [];
        document.getElementById("stat-count").textContent = packages.length;
        document.getElementById("stat-latest").textContent =
          "v" + Math.max(0, ...packages.map((p) => p.version || 0));
        document.getElementById("stat-updated").textContent =
          new Date().toLocaleDateString();
        render();
      })
      .catch(() => {
        const err = document.createElement("div");
        err.className = "error";
        err.innerHTML =
          "⚠️ Could not load <code>packages.json</code>.<br />" +
          "If you opened this file directly (<code>file://</code>), browsers block fetch. " +
          "Serve the folder over HTTP instead:<br /><br /><code>python3 -m http.server 8000</code>";
        grid.replaceChildren(err);
      });

    search.addEventListener("input", () => render(search.value));
  </script>
</body>
</html>
