[package]
name = "ark"
version = "0.1.0"
edition = "2021"
description = "A tiny package manager driven by a web-hosted JSON index"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
strip = true
lto = true
